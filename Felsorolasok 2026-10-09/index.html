<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listák</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <ol>
        <li>Egy</li>
        <li>Kettő</li>
        <li>Három</li>
        <li>Négy</li>
    </ol>

    <ul>
        <li>One</li>
        <li>Two</li>
        <li>Three</li>
        <li>Four</li>
    </ul>
    
    <ul class="happy">
        <li>Info</li>
        <li>Prog</li>
        <li>Matek</li>
        <li>Tesi</li>
    </ul>

    <dl>
        <dt>Hétköznapok</dt>
        <dd>Hétfő</dd>
        <dd>Kedd</dd>
        <dd>Szerda</dd>
        <dd>Csütörtök</dd>
        <dd>Péntek</dd>

        <dt>Hétvége</dt>
        <dd>Szombat</dd>
        <dd>Vasárnap</dd>
    </dl>

    <p class="no-margin">
        Hétköznapok
    </p>
    <ul class="napok">
        <li>Hétfő</li>
        <li>Kedd</li>
        <li>Szerda</li>
        <li>Csütörtök</li>
        <li>Péntek</li>
    </ul>
    <p class="no-margin">
        Hétvége
    </p>
    <ul class="napok">
        <li>Szombat</li>
        <li>Vasárnap</li>
    </ul>
</body>
</html>
