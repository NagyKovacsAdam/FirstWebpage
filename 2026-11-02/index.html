<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meg nehany tag</title>
</head>
<body>
    <p>
       Ez egy <span style="font-weight: bold;">félkövér</span> szó
    </p>
    <p>
        Igy is lehet <b>félkövér</b> ré tenni. (<strong>vagy így</strong>)
    </p>
    <p>
       Ez egy <span style="font-style: italic">dőlt szó</span> szó
    </p>
    <p>
        Igy is lehet <i>dőlt</i> té tenni. (<em>vagy így</em>)
    </p>
    <p>
       Ez egy <span style="text-decoration: underline;">aláhúhott</span> szó
    </p>
    <p>
        Igy is lehet <u>félkövér</u> ré tenni.
    </p>
    
    <!--vízszintes vonalat húz-->
    <hr>

    <p>
        Többsoros bekezdest <br> igy kell csinálni
    </p>

    <p>
        (a+b)<sup>2</sup> = a<sup>2</sup> + 2ab + b<sup>2</sup>
    </p>
    
    <p>
        x<sub>1</sub>
    </p>

    <p>
        plusz tag:
        <ul>
            <li>video</li>
            <li>audio</li>
        </ul>
    </p>
</body>
</html>
